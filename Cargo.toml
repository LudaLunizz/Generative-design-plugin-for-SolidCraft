[package]
name = "generative-design-engine"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "SolidCraft plugin: engineering material library, material reports; generative design to follow"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
