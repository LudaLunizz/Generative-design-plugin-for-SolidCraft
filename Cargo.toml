[package]
name = "generative-design-engine"
version = "0.1.0"
edition = "2021"
description = "Generative design engine for SolidCraft with topology optimization and stress analysis"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1